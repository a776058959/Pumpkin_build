name: Manual Build Pumpkin

on:
  workflow_dispatch:  # 仅手动触发

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # 强制使用 Node.js 24，消除弃用警告

permissions: write-all

jobs:
  # 手动编译（直接编译当前代码，不检查上游更新）
  build:
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.continue-on-error }}
    strategy:
      matrix:
        include:
          # Linux x86_64 标准构建
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: linux-x86_64
            rustflags: ""
            linker: ""
            pkgs: ""
            continue-on-error: false

          # Linux x86_64 旧 CPU 优化构建
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: linux-x86_64-legacy
            rustflags: "-C target-cpu=core2"
            linker: ""
            pkgs: ""
            continue-on-error: false

          # Linux ARM64 构建（实验性，允许失败）
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            suffix: linux-aarch64
            rustflags: ""
            linker: "aarch64-linux-gnu-gcc"
            pkgs: "gcc-aarch64-linux-gnu"
            continue-on-error: true

          # Linux LoongArch64 构建（实验性，允许失败）
          - os: ubuntu-latest
            target: loongarch64-unknown-linux-gnu
            suffix: linux-loongarch64
            rustflags: ""
            linker: "loongarch64-unknown-linux-gnu-gcc"
            pkgs: ""
            continue-on-error: true

          # Windows x86_64 标准构建（实验性，允许失败）
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: windows-x86_64
            rustflags: ""
            linker: ""
            pkgs: ""
            continue-on-error: true

          # Windows x86_64 旧 CPU 优化构建（实验性，允许失败）
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: windows-x86_64-legacy
            rustflags: "-C target-cpu=core2"
            linker: ""
            pkgs: ""
            continue-on-error: true

          # Windows ARM64 构建（实验性，允许失败）
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            suffix: windows-arm64
            rustflags: ""
            linker: ""
            pkgs: ""
            continue-on-error: true

    steps:
      # 检出 master 分支，使用 PAT 进行身份验证，并拉取子模块
      - name: Checkout master branch with PAT and submodules
        uses: actions/checkout@v4
        with:
          ref: master          # 关键：检出 master 分支
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: true      # 关键：拉取子模块

      # 设置日期（使用 Bash 以确保跨平台兼容）
      - name: Set build date and time
        id: datetime
        shell: bash
        run: |
          UTC_DATE=$(date -u +'%Y%m%d')
          UTC_TIME=$(date -u +'%H%M')
          BEIJING_TIME=$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M')
          echo "utc_date=$UTC_DATE" >> $GITHUB_OUTPUT
          echo "utc_time=$UTC_TIME" >> $GITHUB_OUTPUT
          echo "beijing=$BEIJING_TIME" >> $GITHUB_OUTPUT

      # 安装交叉编译工具（仅 Linux 需要）
      - name: Install cross compilation tools (Linux only)
        if: runner.os == 'Linux' && matrix.pkgs != ''
        run: |
          sudo apt update
          sudo apt install -y ${{ matrix.pkgs }}

      # 下载并解压 LoongArch 工具链（仅 Linux 需要）
      - name: Download and extract LoongArch toolchain (Linux only)
        if: runner.os == 'Linux' && matrix.target == 'loongarch64-unknown-linux-gnu'
        run: |
          DOWNLOAD_URL="https://github.com/loongson/build-tools/releases/download/2025.08.08/x86_64-cross-tools-loongarch64-binutils_2.45-gcc_15.1.0-glibc_2.42.tar.xz"
          FILENAME="loongarch64-toolchain.tar.xz"
          TOOLCHAIN_DIR="/opt/loongarch64-toolchain"
          echo "⬇️ 下载 LoongArch 工具链..."
          wget -q --show-progress $DOWNLOAD_URL -O $FILENAME
          echo "📦 解压工具链到 $TOOLCHAIN_DIR ..."
          sudo mkdir -p $TOOLCHAIN_DIR
          sudo tar -xf $FILENAME -C $TOOLCHAIN_DIR --strip-components=0
          if [ -d "$TOOLCHAIN_DIR/bin" ]; then
            BIN_DIR="$TOOLCHAIN_DIR/bin"
          elif [ -d "$TOOLCHAIN_DIR/cross-tools/bin" ]; then
            BIN_DIR="$TOOLCHAIN_DIR/cross-tools/bin"
          else
            echo "❌ 未找到 bin 目录"
            exit 1
          fi
          echo "BIN_DIR=$BIN_DIR" >> $GITHUB_ENV
          echo "$BIN_DIR" >> $GITHUB_PATH
          echo "✅ LoongArch 工具链已安装，bin 目录为 $BIN_DIR"
          ls -l $BIN_DIR | head -20
          COMPILER_NAME="loongarch64-unknown-linux-gnu-gcc"
          if [ -f "$BIN_DIR/$COMPILER_NAME" ]; then
            $BIN_DIR/$COMPILER_NAME --version
          else
            echo "⚠️ 未找到编译器 $COMPILER_NAME"
          fi

      # 安装 Rust
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # 配置链接器（仅 Linux 需要）
      - name: Configure linker (Linux only)
        if: runner.os == 'Linux' && matrix.linker != ''
        run: |
          mkdir -p ~/.cargo
          if [ "${{ matrix.target }}" == "loongarch64-unknown-linux-gnu" ]; then
            LINKER_PATH="$BIN_DIR/${{ matrix.linker }}"
          else
            LINKER_PATH="${{ matrix.linker }}"
          fi
          echo "[target.${{ matrix.target }}]" >> ~/.cargo/config.toml
          echo "linker = \"$LINKER_PATH\"" >> ~/.cargo/config.toml

      # 使用 Bash 运行 cargo 命令，确保环境变量 RUSTFLAGS 正确传递
      - name: Build
        shell: bash
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo build --release --target ${{ matrix.target }}

      # 上传构建产物
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pumpkin-server-${{ matrix.suffix }}-${{ steps.datetime.outputs.utc_date }}
          path: target/${{ matrix.target }}/release/pumpkin${{ runner.os == 'Windows' && '.exe' || '' }}

  # Android ARM64 构建（aarch64-linux-android，静态运行于 Termux / adb shell）
  # 实验性：允许失败，不影响其它平台产物发布
  build-android:
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      ANDROID_API: "24"

    steps:
      # 检出 master 分支，使用 PAT 进行身份验证，并拉取子模块
      - name: Checkout master branch with PAT and submodules
        uses: actions/checkout@v4
        with:
          ref: master          # 关键：检出 master 分支
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: true      # 关键：拉取子模块

      - name: Set build date
        id: datetime
        shell: bash
        run: echo "utc_date=$(date -u +'%Y%m%d')" >> $GITHUB_OUTPUT

      # 安装 Rust（含 Android 目标）
      - name: Install Rust (Android target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      # 定位 runner 预装的 Android NDK
      - name: Locate Android NDK
        id: ndk
        shell: bash
        run: |
          NDK=""
          for d in "$ANDROID_NDK_LATEST_HOME" "$ANDROID_NDK_HOME" "$ANDROID_NDK_ROOT" /usr/local/lib/android/sdk/ndk/*; do
            if [ -n "$d" ] && [ -d "$d/toolchains/llvm/prebuilt/linux-x86_64/bin" ]; then NDK="$d"; break; fi
          done
          if [ -z "$NDK" ]; then echo "❌ 未找到 Android NDK"; exit 1; fi
          echo "ndk=$NDK" >> $GITHUB_OUTPUT
          echo "✅ 使用 NDK: $NDK"
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" --version | head -2

      # 交叉编译到 aarch64-linux-android（ring / lz4 等 C 依赖由 NDK clang 编译）
      - name: Build for Android arm64
        shell: bash
        run: |
          NDK="${{ steps.ndk.outputs.ndk }}"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64"
          BIN="$TOOLCHAIN/bin"
          API="$ANDROID_API"
          CC="$BIN/aarch64-linux-android${API}-clang"
          export CC_aarch64_linux_android="$CC"
          export CXX_aarch64_linux_android="${CC}++"
          export AR_aarch64_linux_android="$BIN/llvm-ar"
          export RANLIB_aarch64_linux_android="$BIN/llvm-ranlib"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$CC"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_AR="$BIN/llvm-ar"
          cargo build --release --target aarch64-linux-android \
            --config "target.aarch64-linux-android.linker=\"$CC\""

      # 静态校验产物
      - name: Verify Android binary
        shell: bash
        run: |
          NDK="${{ steps.ndk.outputs.ndk }}"
          BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          F=target/aarch64-linux-android/release/pumpkin
          ls -lh "$F"
          file "$F" || true
          "$BIN/llvm-readelf" -h "$F" | head -12 || true
          "$BIN/llvm-readelf" -d "$F" | grep -E "NEEDED|interpreter" || true

      # 上传构建产物
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pumpkin-server-android-arm64-${{ steps.datetime.outputs.utc_date }}
          path: target/aarch64-linux-android/release/pumpkin

  # 构建安卓壳 APK（不含服务端；服务端由 App 运行时从 Releases 下载）
  build-android-apk:
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      # 壳源码就在本仓库，直接检出
      - name: Checkout (shell sources)
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set build date
        id: datetime
        shell: bash
        run: echo "utc_date=$(date -u +'%Y%m%d')" >> $GITHUB_OUTPUT

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: android-app
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p apk-out
          cp android-app/app/build/outputs/apk/debug/app-debug.apk \
             "apk-out/pumpkin-shell-${{ steps.datetime.outputs.utc_date }}.apk"
          ls -lh apk-out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pumpkin-android-apk-${{ steps.datetime.outputs.utc_date }}
          path: apk-out/*.apk

  # 统一发布 Release
  release:
    needs: [build, build-android, build-android-apk]
    runs-on: ubuntu-latest
    steps:
      # 取出仓库里的维护脚本
      - name: Checkout (maintenance scripts)
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      # 下载所有构建产物
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # 显示下载的文件结构
      - name: Display structure of downloaded files
        run: ls -R artifacts

      # 获取构建时间戳
      - name: Get build timestamp
        id: timestamp
        run: |
          UTC_DATE=$(date -u +'%Y%m%d')
          UTC_TIME=$(date -u +'%H%M')
          BEIJING_TIME=$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M')
          echo "utc_date=$UTC_DATE" >> $GITHUB_OUTPUT
          echo "utc_time=$UTC_TIME" >> $GITHUB_OUTPUT
          echo "beijing=$BEIJING_TIME" >> $GITHUB_OUTPUT

      # 准备 Release 文件
      - name: Prepare release files
        run: |
          mkdir -p release_files
          for dir in artifacts/pumpkin-server-*; do
            if [ -f "$dir/pumpkin" ]; then
              suffix=$(basename "$dir" | sed 's/^pumpkin-server-//')
              cp "$dir/pumpkin" "release_files/pumpkin-$suffix"
            elif [ -f "$dir/pumpkin.exe" ]; then
              suffix=$(basename "$dir" | sed 's/^pumpkin-server-//')
              cp "$dir/pumpkin.exe" "release_files/pumpkin-$suffix.exe"
            fi
          done
          # Android 安装包（APK）
          find artifacts -name "*.apk" -exec cp {} release_files/ \;
          ls -la release_files

      # 创建 Release
      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          tag: Manual-${{ steps.timestamp.outputs.utc_date }}-${{ steps.timestamp.outputs.utc_time }}
          name: Manual Build ${{ steps.timestamp.outputs.utc_date }}-${{ steps.timestamp.outputs.utc_time }}
          body: |
            手动构建，提交：${{ github.sha }}
            构建时间：${{ steps.timestamp.outputs.beijing }} UTC+8

            下载链接（在 Release 附件中）：
            - `pumpkin-linux-x86_64-${{ steps.timestamp.outputs.utc_date }}` – Linux x86_64 标准构建
            - `pumpkin-linux-x86_64-legacy-${{ steps.timestamp.outputs.utc_date }}` – Linux x86_64 旧 CPU 优化
            - `pumpkin-linux-aarch64-${{ steps.timestamp.outputs.utc_date }}` – Linux ARM64 构建
            - `pumpkin-linux-loongarch64-${{ steps.timestamp.outputs.utc_date }}` – Linux LoongArch64 构建（实验性）
            - `pumpkin-windows-x86_64-${{ steps.timestamp.outputs.utc_date }}.exe` – Windows x86_64 标准构建
            - `pumpkin-windows-x86_64-legacy-${{ steps.timestamp.outputs.utc_date }}.exe` – Windows x86_64 旧 CPU 优化
            - `pumpkin-windows-arm64-${{ steps.timestamp.outputs.utc_date }}.exe` – Windows ARM64 构建（实验性）
            - `pumpkin-android-arm64-${{ steps.timestamp.outputs.utc_date }}` – Android ARM64 构建（aarch64-linux-android，Termux 可运行，实验性）
            - `pumpkin-shell-${{ steps.timestamp.outputs.utc_date }}.apk` – 安卓壳 App（不含服务端，装好后在 App 内下载服务端版本）
          artifacts: "release_files/*"
          allowUpdates: false
          token: ${{ secrets.GITHUB_TOKEN }}

      # 按时间窗口清理旧 Release：
      #   不到 1 个月全留 / 1-2 个月每周留一个 / 2-12 个月每月留一个 / 超 1 年删除
      - name: Prune old releases
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: a776058959/Pumpkin_build
        run: bash .github/scripts/prune-releases.sh