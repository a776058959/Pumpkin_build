name: Build Pumpkin App (APK only)

# 只构建「南瓜坞」App 的 APK：里面**不含**服务端二进制，服务端由 App 运行时从本仓库 Releases 下载。
# 改界面/逻辑后用这个，一分钟左右出包，不用重建 8 个平台的服务端。
#
# ⚠️ 默认**不发布 Release**，只产出 Actions artifact。
#    这一点以前坑过：改完 UI 用这个 workflow 出包，改动只躺在 artifact 里，
#    App 的「检查更新」永远查不到 —— 用户那边等于没更新，而本地 adb 装的是新的，
#    于是「我这边是好的」。要发到用户手里，必须把下面的 publish 勾上（或走 build.yml）。

on:
  workflow_dispatch:
    inputs:
      publish:
        description: '发布成 Release（App 的「检查更新」才能看到这一版）'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    outputs:
      # 透出给 publish job：tag 与 APK 内嵌的 versionCode 必须来自同一个时间戳，
      # 否则会出现「每次都提示有新版本、装完还提示」。
      stamp: ${{ steps.stamp.outputs.utc }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set build stamp
        id: stamp
        shell: bash
        run: |
          # 这个时间戳会烧进 APK 的 versionCode / versionName（见 app/build.gradle.kts）。
          # 不传的话 gradle 会退回 runner 本地时间，产物版本号就跟 CI 时间对不上。
          echo "utc=$(date -u +'%Y%m%d-%H%M')" >> $GITHUB_OUTPUT

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Build App APK
        working-directory: android-app
        # 必须出 **release** 包，不能出 debug 包。
        #
        # simpleperf 采样把这件事抓出来了：debug 包里
        #   artQuickToInterpreterBridge / art::interpreter::ExecuteSwitchImplCpp ≈ 4%，
        #   外加明显的 ConcurrentCopying GC 开销
        # —— 也就是 ART 根本没做 AOT 编译，整个 Compose 运行时跑在解释器上。
        # Compose 极度依赖内联，debug 包因此慢一大截；表现出来就是
        # 「底栏动画像帧数低」。release 包（debuggable=false）会被 dex2oat 编译，
        # 这类开销直接消失。
        #
        # release 与 debug 用**同一把签名密钥**（见 app/build.gradle.kts），
        # 所以 release 包能直接覆盖安装到已装 debug 包的手机，不用卸载。
        run: gradle assembleRelease --no-daemon --stacktrace -PbuildStamp=${{ steps.stamp.outputs.utc }}

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p apk-out
          cp android-app/app/build/outputs/apk/release/app-release.apk \
             "apk-out/pumpkin-app-${{ steps.stamp.outputs.utc }}.apk"
          ls -lh apk-out

      # ---------------------------------------------------------------- 插件
      #
      # 插件是纯 Kotlin 模块，产物是普通 jar，用 D8 转成 dex 由 App 运行时加载。
      #
      # 这里加了一道**必过的断言**：插件的 jar 里绝不能出现 com/pumpkin/plugin/ 的类。
      # 一旦出现（也就是有人把 compileOnly 改成了 implementation），
      # PumpkinPlugin 接口就会在两个类加载器里各有一份，
      # 插件的 instanceof 判断会静默失败 —— 那种问题极难排查，所以宁可在这里构建失败。
      - name: Build plugin and convert to dex
        working-directory: android-app
        run: |
          gradle :plugins:lan-address:jar --no-daemon --stacktrace
          JAR=$(ls plugins/lan-address/build/libs/*.jar | grep -v sources | head -1)
          echo "plugin jar: $JAR"
          if unzip -l "$JAR" | grep -q 'com/pumpkin/plugin/'; then
            echo "::error::插件 jar 里混进了 plugin-api 的类（PumpkinPlugin/PluginHost）。"
            echo "::error::这些类只能由 App 提供，插件必须用 compileOnly 依赖，否则插件的 instanceof 会静默失败。"
            exit 1
          fi
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "d8: $BT/d8"
          mkdir -p plugin-out
          "$BT/d8" --min-api 26 --output plugin-out "$JAR"
          cp plugin-out/classes.dex plugin-out/plugin.dex
          ls -lh plugin-out

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: pumpkin-plugin-lan-address-${{ steps.stamp.outputs.utc }}
          path: android-app/plugin-out/plugin.dex
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pumpkin-app-apk-${{ steps.stamp.outputs.utc }}
          path: apk-out/*.apk

  # 发布：只有勾了 publish 才跑。
  #
  # 只改 App 时服务端二进制没变，没必要为了发个 Release 去重建 8 个平台的 Rust（那要一个多小时）。
  # 代价是这个 Release 里只有 APK —— 这不影响功能：
  #   - App 自更新按 `.apk` 扩展名找，能找到；
  #   - 服务端版本列表只收带 `pumpkin-android-arm64-*` 的 Release（见 UpdateClient.fetchReleases），
  #     所以这种「只有 APK」的发布不会污染服务端版本列表。
  publish:
    needs: apk
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: pumpkin-app-apk-${{ needs.apk.outputs.stamp }}
          path: rel

      - name: Rename to the canonical asset name
        shell: bash
        run: |
          # Release 资产名必须是 pumpkin-shell.apk：文档里的永久链接就是
          #   .../releases/latest/download/pumpkin-shell.apk
          # 改了会让所有已发布的下载链接 404。名字里的 shell 是历史遗留，先留着。
          cp rel/pumpkin-app-*.apk rel/pumpkin-shell.apk
          ls -lh rel

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          STAMP: ${{ needs.apk.outputs.stamp }}
        shell: bash
        run: |
          cat > notes.md <<'EOF'
          ## 南瓜坞 App（仅 App 更新）

          本次只更新 App，**服务端二进制没有变化**，所以这个 Release 只附带 APK。
          服务端请从带 `pumpkin-android-arm64-*` 附件的 Release 获取，App 内「检查更新」也会自动找到。

          ### 安装

          - 覆盖安装即可，不用卸载、不会丢世界数据（签名与旧版一致）
          - 或让 App 自己更新：设置页 →「检查更新」

          EOF
          echo "versionCode = \`$(echo "$STAMP" | tr -d '-')\`（由构建时间戳推导，与 tag 严格一致）" >> notes.md

          # --repo 必须给：这个 job 没有 checkout，gh 在当前目录找不到 .git 会直接失败
          # （failed to run git: fatal: not a git repository）。
          gh release create "Custom-$STAMP" \
            rel/pumpkin-shell.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "Custom Build $STAMP" \
            --notes-file notes.md
