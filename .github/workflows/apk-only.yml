name: Build Pumpkin shell APK

# 只构建「壳」APK：里面**不含**服务端二进制，服务端由 App 运行时从本仓库 Releases 下载。
# 改界面/逻辑后用这个，几十秒就能出包。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set build stamp
        id: stamp
        shell: bash
        run: |
          # 这个时间戳会烧进 APK 的 versionCode / versionName（见 app/build.gradle.kts）。
          # 不传的话 gradle 会退回 runner 本地时间，产物版本号就跟 CI 时间对不上。
          echo "utc=$(date -u +'%Y%m%d-%H%M')" >> $GITHUB_OUTPUT

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Build shell APK
        working-directory: android-app
        run: gradle assembleDebug --no-daemon --stacktrace -PbuildStamp=${{ steps.stamp.outputs.utc }}

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p apk-out
          cp android-app/app/build/outputs/apk/debug/app-debug.apk \
             "apk-out/pumpkin-shell-${{ steps.stamp.outputs.utc }}.apk"
          ls -lh apk-out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pumpkin-shell-apk-${{ steps.stamp.outputs.utc }}
          path: apk-out/*.apk