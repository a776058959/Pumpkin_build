name: Build Pumpkin App (APK only)

# 只构建「南瓜坞」App 的 APK：里面**不含**服务端二进制，服务端由 App 运行时从本仓库 Releases 下载。
# 改界面/逻辑后用这个，一分钟左右出包，不用重建 8 个平台的服务端。
#
# ⚠️ 默认**不发布 Release**，只产出 Actions artifact。
#    这一点以前坑过：改完 UI 用这个 workflow 出包，改动只躺在 artifact 里，
#    App 的「检查更新」永远查不到 —— 用户那边等于没更新，而本地 adb 装的是新的，
#    于是「我这边是好的」。要发到用户手里，必须把下面的 publish 勾上（或走 build.yml）。

on:
  workflow_dispatch:
    inputs:
      publish:
        description: '发布成 Release（App 的「检查更新」才能看到这一版）'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    outputs:
      # 透出给 publish job：tag 与 APK 内嵌的 versionCode 必须来自同一个时间戳，
      # 否则会出现「每次都提示有新版本、装完还提示」。
      stamp: ${{ steps.stamp.outputs.utc }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set build stamp
        id: stamp
        shell: bash
        run: |
          # 这个时间戳会烧进 APK 的 versionCode / versionName（见 app/build.gradle.kts）。
          # 不传的话 gradle 会退回 runner 本地时间，产物版本号就跟 CI 时间对不上。
          echo "utc=$(date -u +'%Y%m%d-%H%M')" >> $GITHUB_OUTPUT

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Build App APK
        working-directory: android-app
        # 必须出 **release** 包，不能出 debug 包。
        #
        # simpleperf 采样把这件事抓出来了：debug 包里
        #   artQuickToInterpreterBridge / art::interpreter::ExecuteSwitchImplCpp ≈ 4%，
        #   外加明显的 ConcurrentCopying GC 开销
        # —— 也就是 ART 根本没做 AOT 编译，整个 Compose 运行时跑在解释器上。
        # Compose 极度依赖内联，debug 包因此慢一大截；表现出来就是
        # 「底栏动画像帧数低」。release 包（debuggable=false）会被 dex2oat 编译，
        # 这类开销直接消失。
        #
        # release 与 debug 用**同一把签名密钥**（见 app/build.gradle.kts），
        # 所以 release 包能直接覆盖安装到已装 debug 包的手机，不用卸载。
        run: gradle assembleRelease --no-daemon --stacktrace -PbuildStamp=${{ steps.stamp.outputs.utc }}

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p apk-out
          cp android-app/app/build/outputs/apk/release/app-release.apk \
             "apk-out/pumpkin-app-${{ steps.stamp.outputs.utc }}.apk"
          ls -lh apk-out

      # ---------------------------------------------------------------- 插件
      #
      # 插件是纯 Kotlin 模块（android-app/plugins/<模块名>），产物是普通 jar，
      # 用 D8 转成 dex，由 App 运行时用 DexClassLoader 加载。
      #
      # 新增一个插件 = 新建一个模块目录 + 写 plugin.json，这里自动就会发现它，
      # 不需要改 workflow。每个插件模块里的 plugin.json 就是**商店索引的唯一来源**：
      #   { id, name, version, description, entry }  →  CI 补上 dex 文件名后汇总成 plugins.json
      # 所以「插件列表里显示的版本」和「dex 里的代码」永远来自同一次提交，
      # 不会出现「改了代码忘了改索引」。
      #
      # 这里加了一道**必过的断言**：插件的 jar 里绝不能出现 plugin-api 的类。
      # 一旦出现（也就是有人把 compileOnly 改成了 implementation），
      # PumpkinPlugin 接口就会在两个类加载器里各有一份，
      # 插件的 instanceof 判断会静默失败 —— 那种问题极难排查，所以宁可在这里构建失败。
      - name: Build plugins and convert to dex
        working-directory: android-app
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "d8: $BT/d8"
          mkdir -p plugin-out
          : > plugin-out/index.tsv

          for dir in plugins/*/; do
            name=$(basename "$dir")
            [ -f "$dir/build.gradle.kts" ] || continue
            echo "==== 构建插件 $name ===="

            gradle ":plugins:$name:jar" --no-daemon --stacktrace

            JAR=$(ls "plugins/$name"/build/libs/*.jar | grep -v sources | head -1)
            echo "plugin jar: $JAR"

            # 精确匹配 API 的类名：插件自己的包是 com.pumpkin.plugin.<x>，
            # 它会天然命中 'com/pumpkin/plugin/' 这个前缀（第一版就因此误报过）。
            if unzip -l "$JAR" | grep -qE 'com/pumpkin/plugin/(PumpkinPlugin|PluginHost|PluginSetting|PluginKeys)'; then
              echo "::error::插件 $name 的 jar 里混进了 plugin-api 的类（PumpkinPlugin/PluginHost）。"
              echo "::error::这些类只能由 App 提供，插件必须用 compileOnly 依赖，否则插件的 instanceof 会静默失败。"
              exit 1
            fi

            rm -rf plugin-tmp && mkdir -p plugin-tmp
            "$BT/d8" --min-api 26 --output plugin-tmp "$JAR"
            cp plugin-tmp/classes.dex "plugin-out/plugin-$name.dex"

            # 索引里记一行：模块名 + plugin.json
            printf '%s\t%s\n' "$name" "$dir/plugin.json" >> plugin-out/index.tsv
          done

          ls -lh plugin-out

      # 汇总成商店索引。dex 文件名由 CI 按模块名派生（plugin-<模块名>.dex），
      # 不让 plugin.json 自己写 —— 否则改个模块名就会出现「索引指向一个不存在的附件」。
      - name: Build plugin store index
        working-directory: android-app
        run: |
          python3 - <<'PY'
          import json, pathlib

          out = []
          for line in pathlib.Path("plugin-out/index.tsv").read_text().splitlines():
              if not line.strip():
                  continue
              module, manifest = line.split("\t")
              meta = json.loads(pathlib.Path(manifest).read_text(encoding="utf-8"))
              for field in ("id", "name", "version", "entry"):
                  if not str(meta.get(field, "")).strip():
                      raise SystemExit("plugin.json 缺少字段 " + field + "：" + manifest)
              meta["dex"] = "plugin-" + module + ".dex"
              if not (pathlib.Path("plugin-out") / meta["dex"]).exists():
                  raise SystemExit("没有生成 " + meta["dex"])
              out.append(meta)

          ids = [m["id"] for m in out]
          if len(ids) != len(set(ids)):
              raise SystemExit("插件 id 重复：" + repr(ids))

          index = {"version": 1, "plugins": out}
          pathlib.Path("plugin-out/plugins.json").write_text(
              json.dumps(index, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(index, ensure_ascii=False, indent=2))
          PY

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: pumpkin-plugins-${{ steps.stamp.outputs.utc }}
          path: android-app/plugin-out/*.dex
      - name: Upload plugin store index
        uses: actions/upload-artifact@v4
        with:
          name: pumpkin-plugins-index-${{ steps.stamp.outputs.utc }}
          path: android-app/plugin-out/plugins.json
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pumpkin-app-apk-${{ steps.stamp.outputs.utc }}
          path: apk-out/*.apk

  # 发布：只有勾了 publish 才跑。
  #
  # 只改 App 时服务端二进制没变，没必要为了发个 Release 去重建 8 个平台的 Rust（那要一个多小时）。
  # 代价是这个 Release 里只有 APK —— 这不影响功能：
  #   - App 自更新按 `.apk` 扩展名找，能找到；
  #   - 服务端版本列表只收带 `pumpkin-android-arm64-*` 的 Release（见 UpdateClient.fetchReleases），
  #     所以这种「只有 APK」的发布不会污染服务端版本列表。
  publish:
    needs: apk
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: pumpkin-app-apk-${{ needs.apk.outputs.stamp }}
          path: rel

      - name: Rename to the canonical asset name
        shell: bash
        run: |
          # Release 资产名必须是 pumpkin-shell.apk：文档里的永久链接就是
          #   .../releases/latest/download/pumpkin-shell.apk
          # 改了会让所有已发布的下载链接 404。名字里的 shell 是历史遗留，先留着。
          cp rel/pumpkin-app-*.apk rel/pumpkin-shell.apk
          ls -lh rel

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          STAMP: ${{ needs.apk.outputs.stamp }}
        shell: bash
        run: |
          cat > notes.md <<'EOF'
          ## 南瓜坞 App（仅 App 更新）

          本次只更新 App，**服务端二进制没有变化**，所以这个 Release 只附带 APK。
          服务端请从带 `pumpkin-android-arm64-*` 附件的 Release 获取，App 内「检查更新」也会自动找到。

          ### 安装

          - 覆盖安装即可，不用卸载、不会丢世界数据（签名与旧版一致）
          - 或让 App 自己更新：设置页 →「检查更新」

          EOF
          echo "versionCode = \`$(echo "$STAMP" | tr -d '-')\`（由构建时间戳推导，与 tag 严格一致）" >> notes.md

          # --repo 必须给：这个 job 没有 checkout，gh 在当前目录找不到 .git 会直接失败
          # （failed to run git: fatal: not a git repository）。
          gh release create "Custom-$STAMP" \
            rel/pumpkin-shell.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "Custom Build $STAMP" \
            --notes-file notes.md

  # 插件商店：把插件 dex 与索引发到一个**固定 tag** 的 Release（tag = plugins）。
  #
  # 为什么不跟 App 一起发：插件和 App 是两个独立的更新节奏 ——
  # 改一个插件不该逼所有人重装 App。App 侧按 tag 取附件
  # （见 UpdateClient.releaseAssetUrl），所以这个 Release 建一次就一直复用。
  #
  # 发成 prerelease：这样它不会成为仓库的「Latest release」，
  # 因此既不影响 App 自更新找 APK，也不影响服务端版本列表。
  plugins:
    needs: apk
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download plugin dex files
        uses: actions/download-artifact@v4
        with:
          name: pumpkin-plugins-${{ needs.apk.outputs.stamp }}
          path: rel-plugins

      - name: Download plugin store index
        uses: actions/download-artifact@v4
        with:
          name: pumpkin-plugins-index-${{ needs.apk.outputs.stamp }}
          path: rel-plugins

      - name: Publish plugin store release
        env:
          GH_TOKEN: ${{ github.token }}
          STAMP: ${{ needs.apk.outputs.stamp }}
        shell: bash
        run: |
          ls -lh rel-plugins
          cat rel-plugins/plugins.json

          # tag 固定为 plugins —— App 就是按这个 tag 取 plugins.json 的。
          # 已存在就覆盖附件（--clobber），否则插件更新永远发不出去。
          if gh release view plugins --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload plugins rel-plugins/*.dex rel-plugins/plugins.json \
              --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit plugins \
              --repo "$GITHUB_REPOSITORY" \
              --title "插件商店（$STAMP 更新）" \
              --notes "插件索引与 dex。App 的「插件」页读这里的 plugins.json，不需要 root。"
          else
            gh release create plugins rel-plugins/*.dex rel-plugins/plugins.json \
              --repo "$GITHUB_REPOSITORY" \
              --prerelease \
              --title "插件商店（$STAMP 更新）" \
              --notes "插件索引与 dex。App 的「插件」页读这里的 plugins.json，不需要 root。"
          fi
