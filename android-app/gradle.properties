org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
android.useAndroidX=true
android.nonFinalResIds=false
# R8 的「优化版资源删减」要求资源 ID 非 final，而上一行把它设成了 false，两者冲突，
# 报错：Optimized resource shrinking requires non-final IDs.
#
# 这里退回传统资源删减，而不是去掉 nonFinalResIds=false：
# 资源总共只占 APK 的 0.4%（0.04MB），删减优化没有意义；
# 体积大头在 dex（94%），那部分由 isMinifyEnabled 负责，和这个开关无关。
# 哪天想走 AGP 推荐的新路（nonFinalResIds 默认值），把上一行删掉即可。
android.r8.optimizedResourceShrinking=false
# AGP 9 内置 Kotlin 与独立 KGP 冲突：禁用内置 + 关闭新 DSL（官方临时绕过，AGP 10 移除）
android.builtInKotlin=false
android.newDsl=false
kotlin.code.style=official
kotlin.incremental=true
kotlin.caching.enabled=true
